name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline test target on macOS and Linux
        if: runner.os != 'Windows'
        run: make test
        shell: bash
        env:
          PYTHON: python
      - name: Run offline Python tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
        shell: pwsh
