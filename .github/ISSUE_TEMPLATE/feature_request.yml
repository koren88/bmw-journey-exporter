name: Feature request
description: Suggest an improvement to BMW Journey Exporter.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include real journey exports, raw phone XML, addresses, VINs,
        device serials, credentials, or other personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposed-improvement
    attributes:
      label: Proposed improvement
      description: Describe what you would like the project to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered?
    validations:
      required: false
